<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 256 256" width="256" height="256">
<title>WP Choose Your Theme</title>
<style>
.dot { transform-box: fill-box; transform-origin: center; animation: dab 3.2s ease-in-out infinite; }
.dot-1 { animation-delay: .2s; } .dot-2 { animation-delay: .4s; } .dot-3 { animation-delay: .6s; }
@keyframes dab { 0%, 40%, 100% { transform: scale(1); } 15% { transform: scale(1.28); } 28% { transform: scale(.92); } }
.hue { animation: hue 9.6s linear infinite; }
@keyframes hue { to { filter: hue-rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs><clipPath id="disc"><circle cx="128" cy="128" r="119"/></clipPath></defs>
<circle cx="128" cy="128" r="119" fill="#7E57C2"/>
<defs><mask id="palette"><rect width="256" height="256" fill="#fff"/><circle cx="192.5" cy="197.5" r="32.5" fill="#000"/><circle cx="163.5" cy="135.5" r="14" fill="#000"/></mask></defs><g clip-path="url(#disc)"><g fill="#624397"><ellipse cx="128" cy="128.75" rx="80.5" ry="71.25"/><ellipse cx="303" cy="303.75" rx="80.5" ry="71.25"/><path d="M188.28 81.53L67.72 175.97L242.72 350.97L363.28 256.53Z"/></g><ellipse cx="128" cy="128.75" rx="80.5" ry="71.25" fill="#fff" mask="url(#palette)"/><g class="hue"><circle class="dot dot-0" cx="90.5" cy="97" r="14" fill="#EF5350"/><circle class="dot dot-1" cx="130" cy="82.5" r="14" fill="#FFCA28"/><circle class="dot dot-2" cx="169" cy="100" r="14" fill="#66BB6A"/><circle class="dot dot-3" cx="85" cy="140" r="14" fill="#42A5F5"/></g></g>
</svg>
